
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('https://cdn.discordapp.com/attachments/1254288220922056725/1324948652271341589/11zon_resized.png?ex=677a0217&is=6778b097&hm=0c26c8ab1fc13cab2bac3e24b4cf5d6d7844376dde8ae7f94d54496177f67719&') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Bungee', cursive;
            font-size: 24px;
            color: #FF69B4;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(255, 105, 180, 0.8);
        }
        p {
            font-size: 14px;
            font-family: 'Verdana', sans-serif;
            color: #ccc;
            margin-top: 10px;
        }
        a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        a:hover {
            text-decoration: underline;
        }
        .button {
            background-color: #008000;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0px 4px 10px rgba(0, 128, 0, 0.5);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .button:hover {
            background-color: #006400;
            transform: translateY(-2px);
        }
        .button:before {
            content: '\2714';
            font-size: 16px;
            margin-right: 5px;
        }
        .update-message {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
        .audio-container {
            margin-top: 20px;
            background-color: rgba(0, 0, 255, 0.3); /* Red transparent background */
            border: 2px solid rgba(0, 0, 255, 0.6); /* Darker red border */
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 255, 0.5); /* Glow effect */
        }
        .audio-container audio {
            width: 100%;
            outline: none;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>@rayvladi is not terminated</h1>
        <p><a href="https://ammo.lol/ray" target="_blank">social media manager</a></p>
        <button class="button">Active</button>
        <p class="update-message">join .gg/bladiw .gg/hellraiser.</p>
        <!-- Styled audio player -->
        <div class="audio-container">
            <audio controls autoplay>
                <source src="https://cdn.discordapp.com/attachments/1254288220922056725/1324948275643551764/Final_Warning.mp3?ex=677a01bd&is=6778b03d&hm=c2f87ab1f5622db6accd191355f5866e4479778f759d6fd0d41f8b6e694fa2dd&">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>
</body>
</html>
