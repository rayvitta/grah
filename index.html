<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('https://cdn.discordapp.com/attachments/929835145026994196/1327106524199387136/b21ac3fc173d00a91b368a9593303ba9.gif?ex=6781dbc3&is=67808a43&hm=eb0d04ccb1871218ce0ffa186991aae9c94c5036682b72d7f1dd6f875df652aa&') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-family: 'Bungee', cursive;
            font-size: 24px;
            color: #59c2f5;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(255, 165, 0, 0.8);
        }
        p {
            font-size: 14px;
            font-family: 'Verdana', sans-serif;
            color: #ccc;
            margin-top: 10px;
        }
        a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        a:hover {
            text-decoration: underline;
        }
        .button {
            background-color: #59c2f5;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0px 4px 10px rgba(0, 128, 0, 0.5);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .button:hover {
            background-color: #59c2f5;
            transform: translateY(-2px);
        }
        .button:before {
            content: '\2714';
            font-size: 16px;
            margin-right: 5px;
        }
        .click-me {
            font-family: 'Bungee', cursive;
            font-size: 20px;
            color: #59c2f5;
            margin-top: 20px;
            text-shadow: 2px 2px 8px rgba(255, 165, 0, 0.8);
            cursor: pointer;
        }
        .click-me:hover {
            text-decoration: underline;
        }
        .update-message {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
        .audio-container {
            margin-top: 20px;
            background-color: rgba(89, 194, 245, 0.3); /* Blue transparent background */
            border: 2px solid rgba(89, 194, 245, 0.6); /* Darker blue border */
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(89, 194, 245, 0.5); /* Glow effect */
        }
        .audio-container audio {
            width: 100%;
            outline: none;
            border: none;
        }
    </style>
</head>
<body>
