    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling due to image zoom */
            background: url('https://cdn.discordapp.com/attachments/1259218714176262324/1340855245487739004/Kog_1.gif?ex=67b3e042&is=67b28ec2&hm=c42f6f959fbcd668abe2a4b1f889637c227b145d733856c7b676603f141b6311&') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Roboto', sans-serif; /* Keep Roboto font */
            color: white;
            text-align: center;
            transition: background-size 0.5s ease; /* Smooth zoom effect on background */
        }

        body:hover {
            background-size: 110%; /* Zoom in on background image */
        }

        .container {
            background: rgba(0, 0, 0, 0.7); /* Semi-transparent black */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            opacity: 0; /* Start hidden for animation */
            transform: translateY(20px); /* Start slightly below */
            animation: fadeIn 1s forwards; /* Trigger animation */
        }

        @keyframes fadeIn {
            to {
                opacity: 1; /* Fade in */
                transform: translateY(0); /* Move to original position */
            }
        }

        h1, p {
            margin: 10px 0;
            transition: transform 0.3s ease, color 0.3s ease; /* Smooth transition for hover effect */
        }

        h1:hover, p:hover {
            transform: scale(1.05); /* Scale up on hover */
            color: #ffcc00; /* Change color on hover */
        }

        h1 {
            font-size: 2.5em;
        }

        p {
            font-size: 1.2em;
        }
    </style>
</head>
