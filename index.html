<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@.4xray_ #raybladi #status</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('https://i.ibb.co/8xC598Y/ezgif-6-febcdaccc3-1.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: none; /* Initially hidden until user clicks */
        }
        h1 {
            font-family: 'Bungee', cursive;
            font-size: 24px;
            color: #FF0004;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(255, 105, 180, 0.8);
        }
        p {
            font-size: 14px;
            font-family: 'Verdana', sans-serif;
            color: #ccc;
            margin-top: 10px;
        }
        a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        a:hover {
            text-decoration: underline;
        }
        .button {
            background-color: #FF0004; /* Changed to red */
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0px 4px 10px rgba(0, 128, 0, 0.5);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .button:hover {
            background-color: #FF0004;
            transform: translateY(-2px);
        }
        .button:before {
            content: '\2714';
            font-size: 16px;
            margin-right: 5px;
        }
        .update-message {
            font-size: 12px;
            color: #FF;
            margin-top: 15px;
        }
        .audio-container {
            margin-top: 20px;
            background-color: rgba(255, 0, 0, 0.3); /* Red transparent background */
            border: 2px solid rgba(255, 0, 0, 0.6); /* Darker red border */
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5); /* Red glow effect */
        }
        .audio-container audio {
            width: 100%;
            outline: none;
            border: none;
            background-color: red; /* Attempt to change the background of the player */
        }
        .enter-message {
            position: absolute;
            color: #FF0004;
            font-size: 24px;
            font-family: 'Bungee', cursive;
            text-shadow: 2px 2px 8px rgba(255, 105, 180, 0.8);
            cursor: pointer;
            z-index: 9999;
        }
        .ip-address {
            font-size: 18px;
            color: #FF0004;
            margin-top: 20px; /* Adds space below the container */
            font-family: 'Bungee', cursive;
            text-shadow: 2px 2px 8px rgba(255, 105, 180, 0.8);
            display: none; /* Initially hidden */
        }

        /* Mute button style */
        .mute-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: black;
            color: white;
            border: none;
            font-size: 20px;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }
        .mute-button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="enter-message" onclick="enterWebsite()">Tap to Enter</div>
    <div class="container">
        <h1>@raybladi is not terminated</h1>
        <p><a href="https://ammo.lol/ray" target="_blank">don't click 🍒</a></p>
        <button class="button">active</button>
        <p class="update-message">if i get termed, this will be updated.</p>
        <!-- Styled audio player -->
        <div class="audio-container">
            <audio id="audio-player" autoplay>
                <source src="https://cdn.discordapp.com/attachments/1272680849795453041/1325422041385537598/Ken_Carson_-_ss_Official_Audio.mp3?ex=677bbaf7&is=677a6977&hm=525e8c84408c0a790dd374e837d3ac608c836070a39ede9f6338f3a73749c2b6&" type="audio/mp3">
                your browser does not support the audio element.
            </audio>
        </div>
    </div>
    <!-- IP address will appear below the main box -->
    <div id="ip-container" class="ip-address"></div>

    <!-- Mute button -->
    <button class="mute-button" onclick="toggleMute()">🔊</button>

    <script>
        let audioPlayer = document.getElementById('audio-player');

        // Disable right-click
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            alert("stop tryna view my sc.");
        });

        // Disable certain keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
                e.preventDefault();
                alert("you can't skid off me.");
            }
        });

        // Function to get and display the user's IP address
        function fetchUserIP() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('ip-container').innerText = "Your IP: " + data.ip;
                    document.getElementById('ip-container').style.display = 'block';  // Show IP after fetch
                })
                .catch(error => {
                    console.error("Error fetching IP address:", error);
                });
        }

        function enterWebsite() {
            // Hide the "click here 🍒" message
            document.querySelector('.enter-message').style.display = 'none';
            // Show the main content after tap
            document.querySelector('.container').style.display = 'block';
            // Autoplay the music
            audioPlayer.play();
            // Fetch and display the user's IP address
            fetchUserIP();
        }

        // Function to toggle mute/unmute the audio
        function toggleMute() {
            if (audioPlayer.muted) {
                audioPlayer.muted = false;
                document.querySelector('.mute-button').innerText = '🔊';  // Change icon to sound on
            } else {
                audioPlayer.muted = true;
                document.querySelector('.mute-button').innerText = '🔇';  // Change icon to mute
            }
        }
    </script>
</body>
</html>
